<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if plan %}{{ plan.start.label }} → {{ plan.finish.label }} · {% endif %}Fuel route</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; color: #1f2933; display: flex; height: 100vh; }
    #panel { width: 380px; overflow-y: auto; padding: 20px; border-right: 1px solid #e4e7eb; }
    #map { flex: 1; }
    h1 { font-size: 17px; margin: 0 0 4px; }
    .muted { color: #616e7c; font-size: 12px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0; }
    .stat { background: #f5f7fa; border-radius: 8px; padding: 10px; }
    .stat b { display: block; font-size: 18px; }
    .stop { border-top: 1px solid #e4e7eb; padding: 10px 0; display: flex; gap: 10px; }
    .badge { flex: none; width: 24px; height: 24px; border-radius: 50%; background: #d64545; color: #fff; font-weight: 600; display: grid; place-items: center; font-size: 12px; }
    .error { padding: 40px; }
    .pin { background: #d64545; color: #fff; border: 2px solid #fff; border-radius: 50%; font-weight: 600; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  </style>
</head>
<body>
{% if error %}
  <div class="error"><h1>Couldn't plan this trip</h1><p>{{ error }}</p></div>
{% else %}
  <aside id="panel"></aside>
  <div id="map"></div>
  {{ plan|json_script:"plan-data" }}
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const plan = JSON.parse(document.getElementById("plan-data").textContent);
    const s = plan.summary;
    const money = (n) => "$" + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    document.getElementById("panel").innerHTML = `
      <h1>${esc(plan.start.label)} → ${esc(plan.finish.label)}</h1>
      <div class="muted">${plan.assumptions.vehicle_range_miles} mi range · ${plan.assumptions.miles_per_gallon} mpg · starts with a full tank</div>
      <div class="stats">
        <div class="stat"><b>${money(s.total_fuel_cost)}</b>fuel cost</div>
        <div class="stat"><b>${s.number_of_fuel_stops}</b>fuel stops</div>
        <div class="stat"><b>${s.total_distance_miles.toLocaleString()} mi</b>distance</div>
        <div class="stat"><b>${s.total_gallons_purchased.toLocaleString()} gal</b>purchased</div>
      </div>
      ${plan.fuel_stops.length ? "" : '<p class="muted">The trip fits in one tank, so no fuel stops are needed.</p>'}
      ${plan.fuel_stops.map((f) => `
        <div class="stop">
          <div class="badge">${f.stop_number}</div>
          <div>
            <b>${esc(f.name)}</b><br>
            <span class="muted">${esc(f.address)}, ${esc(f.city)}, ${f.state} · mile ${f.route_mile}</span><br>
            ${f.gallons_purchased.toFixed(1)} gal × $${f.price_per_gallon.toFixed(3)} = <b>${money(f.cost)}</b>
          </div>
        </div>`).join("")}
      <p class="muted">Grey dots: ${s.stations_considered} stations within ${plan.assumptions.station_corridor_miles} mi of the route.</p>`;

    const map = L.map("map", { preferCanvas: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    // Candidate stations first so the route line is drawn on top of them.
    for (const [lat, lon, price, name] of plan.stations_considered) {
      L.circleMarker([lat, lon], { radius: 4, color: "#9aa5b1", weight: 1, fillOpacity: 0.4 })
        .bindTooltip(`${esc(name)} · $${price.toFixed(3)}`).addTo(map);
    }
    const line = L.geoJSON(plan.route, { style: { color: "#2f6fde", weight: 4, opacity: 0.9 } }).addTo(map);
    map.fitBounds(line.getBounds(), { padding: [30, 30] });
    for (const [point, label, color] of [[plan.start, "Start", "#2f9e44"], [plan.finish, "Finish", "#1f2933"]]) {
      L.circleMarker([point.lat, point.lon], { radius: 8, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1 })
        .bindPopup(`<b>${label}</b><br>${esc(point.label)}`).addTo(map);
    }
    for (const f of plan.fuel_stops) {
      const icon = L.divIcon({ className: "", html: `<div class="pin" style="width:26px;height:26px">${f.stop_number}</div>`, iconSize: [26, 26] });
      L.marker([f.lat, f.lon], { icon }).bindPopup(
        `<b>${f.stop_number}. ${esc(f.name)}</b><br>${esc(f.city)}, ${f.state}<br>` +
        `$${f.price_per_gallon.toFixed(3)}/gal · ${f.gallons_purchased.toFixed(1)} gal · <b>${money(f.cost)}</b>`
      ).addTo(map);
    }
  </script>
{% endif %}
</body>
</html>
